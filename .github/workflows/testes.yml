name: Pipeline CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # JOB 1 - INTEGRACAO CONTINUA (CI)
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: python -m pip install pytest

      - name: Executar testes
        run: python -m pytest -v

      - name: Criar pacote ZIP
        run: |
          mkdir -p pacote
          cp relatorio.py pacote/
          zip -r controle-inventario.zip pacote/

      - name: Armazenar artefato
        uses: actions/upload-artifact@v4
        with:
          name: controle-inventario
          path: controle-inventario.zip

  # JOB 2 - HOMOLOGACAO
  homologacao:
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: controle-inventario

      - name: Simular homologacao
        run: |
          mkdir -p homologacao
          unzip -o controle-inventario.zip -d homologacao

      - name: Validar homologacao
        run: |
          PYTHONPATH=homologacao/pacote python -c 'from relatorio import gerar_relatorio; assert gerar_relatorio([1, 2]) == "Relatório Gerado: 2"; print("Homologacao aprovada")'

      - name: Armazenar homologacao
        uses: actions/upload-artifact@v4
        with:
          name: homologacao
          path: homologacao/

  # JOB 3 - PRODUCAO
  producao:
    needs: homologacao
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: controle-inventario

      - name: Simular producao
        run: |
          mkdir -p producao
          unzip -o controle-inventario.zip -d producao

      - name: Executar aplicacao em producao
        run: |
          PYTHONPATH=producao/pacote python -c 'from relatorio import gerar_relatorio; print(gerar_relatorio([1, 2]))'
